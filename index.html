<script type="text/babel" data-type="module" data-presets="react">

/* =========================================================================
   Johnson Equipment — Scissor Lifts lead-gen prototype
   scissorlifts.jequip.com  ·  proof of concept
   Johnson part numbers are PLACEHOLDERS pending the real cross-reference.
   ========================================================================= */

const HEIGHTS = [
  { key: "19", label: "19 ft Electric Scissor Lifts", working: 25, slug: "19-ft-electric-scissor-lifts",
    blurb: "Compact slab electric lifts for indoor maintenance, retail fit-outs and tight aisles." },
  { key: "26", label: "26 ft Electric Scissor Lifts", working: 32, slug: "26-ft-electric-scissor-lifts",
    blurb: "The warehouse workhorse — wider decks and higher capacity for stock, MEP and signage work." },
  { key: "32", label: "32 ft Electric Scissor Lifts", working: 38, slug: "32-ft-electric-scissor-lifts",
    blurb: "Mid-rise reach for distribution centers, big-box retail and steel erection support." },
  { key: "40", label: "40 ft Electric Scissor Lifts", working: 46, slug: "40-ft-electric-scissor-lifts",
    blurb: "Maximum platform height in the electric class for high-bay and large-volume facilities." },
];

// [make, model, platformHt, widthIn, capacityLb, powerNote?]
const RAW = [
  ["Genie", "GS-1930", 19, 30, 500], ["Genie", "GS-1932", 19, 32, 500],
  ["Genie", "GS-2632", 26, 32, 500], ["Genie", "GS-2646", 26, 46, 1000],
  ["Genie", "GS-3232", 32, 32, 550], ["Genie", "GS-3246", 32, 46, 705],
  ["Genie", "GS-4047", 40, 47, 770], ["Genie", "GS-4069", 40, 69, 1500],
  ["JLG", "1930ES", 19, 30, 500], ["JLG", "ES1932", 19, 32, 550],
  ["JLG", "AE1932", 19, 32, 550], ["JLG", "ES2632", 26, 32, 500],
  ["JLG", "2646ES", 26, 46, 1000], ["JLG", "ES3246", 32, 46, 705],
  ["JLG", "4045R", 40, 45, 770], ["JLG", "4069LE", 40, 69, 1430],
  ["Skyjack", "SJ III 3219", 19, 32, 550], ["Skyjack", "SJ3220", 20, 32, 550],
  ["Skyjack", "SJ III 3226", 26, 32, 550], ["Skyjack", "SJ III 4626", 26, 46, 772],
  ["Skyjack", "SJ4632", 32, 46, 772], ["Skyjack", "SJ4732", 32, 47, 772],
  ["Skyjack", "SJ4740", 40, 47, 772], ["Skyjack", "SJ6832 RTE", 40, 68, 1500, "Electric · rough terrain"],
  ["MEC", "1930SE", 19, 30, 550], ["MEC", "Micro 19", 19, 23, 500],
  ["MEC", "2632SE Slim", 26, 32, 600], ["MEC", "3232+", 32, 32, 600],
  ["MEC", "3346+", 33, 46, 800], ["MEC", "4046+", 40, 46, 800],
  ["MEC", "4069ERT", 40, 69, 1430, "Electric · rough terrain"],
  ["Snorkel", "S3219E", 19, 32, 500], ["Snorkel", "S3226E", 26, 32, 550],
  ["Snorkel", "S4732E", 32, 47, 750],
  ["Haulotte", "Compact 1930E", 19, 32, 507], ["Haulotte", "Compact 2632E", 26, 32, 550],
  ["Haulotte", "Compact 12DX", 32, 46, 772], ["Haulotte", "Compact 14", 40, 46, 770],
  ["LGMG", "AS1932E", 19, 32, 550], ["LGMG", "AS2632E", 26, 32, 600],
  ["LGMG", "AS3246E", 32, 46, 705], ["LGMG", "AS4047E", 40, 47, 770],
  ["Dingli", "JCPT0607DC", 19, 30, 530], ["Dingli", "JCPT1218DC", 40, 47, 770],
  ["Sinoboom", "1932SE", 19, 32, 550], ["Sinoboom", "2632E", 26, 32, 600],
  ["Sinoboom", "3246E", 32, 46, 705], ["Sinoboom", "4047E", 40, 47, 770],
];

const BRAND_HEX = {
  Genie: "#1d4ed8", JLG: "#ea580c", Skyjack: "#0891b2", MEC: "#16a34a",
  Snorkel: "#7c3aed", Haulotte: "#db2777", LGMG: "#0d9488", Dingli: "#ca8a04",
  Sinoboom: "#4f46e5",
};

const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
const bucket = (h) => (h <= 20 ? "19" : h <= 29 ? "26" : h <= 35 ? "32" : "40");

const MODELS = RAW.map(([make, model, ph, w, cap, power], i) => {
  const hk = bucket(ph);
  return {
    id: i + 1, make, model, platformHt: ph, workingHt: ph + 6, width: w, capacity: cap,
    power: power || "Electric (DC)", driveHeight: "Full height", heightKey: hk,
    slug: slugify(`${make}-${model}`),
    jePN: `JE-SL-${hk}${String(w).padStart(2, "0")}`, // placeholder cross-reference
  };
});

const findModel = (slug) => MODELS.find((m) => m.slug === slug);
const inHeight = (hk) => MODELS.filter((m) => m.heightKey === hk);

/* ----------------------------------------------------------------------- */
/* Atoms                                                                    */
/* ----------------------------------------------------------------------- */

const Eyebrow = ({ children, light }) => (
  <div className="font-display flex items-center gap-2 text-xs font-600 uppercase tracking-widest"
    style={{ letterSpacing: "0.18em", color: light ? "#fbbf24" : "#1e40af" }}>
    <span className="inline-block h-2 w-2" style={{ background: "#fbbf24" }} />
    {children}
  </div>
);

const HazardRule = ({ h = 6 }) => (
  <div style={{ height: h, background: "repeating-linear-gradient(45deg,#0f172a 0 12px,#fbbf24 12px 24px)" }} />
);

const PN = ({ children, tone = "slate" }) => {
  const map = {
    slate: { bg: "#f1f5f9", fg: "#0f172a", bd: "#cbd5e1" },
    blue: { bg: "#1e3a8a", fg: "#fff", bd: "#1e3a8a" },
    amber: { bg: "#fef3c7", fg: "#78350f", bd: "#fcd34d" },
  }[tone];
  return (
    <span className="font-pn inline-flex items-center rounded px-2 py-0.5 text-sm font-500"
      style={{ background: map.bg, color: map.fg, border: `1px solid ${map.bd}` }}>
      {children}
    </span>
  );
};

const BrandDot = ({ make }) => (
  <span className="inline-block h-2.5 w-2.5 rounded-full" style={{ background: BRAND_HEX[make] || "#64748b" }} />
);

const Btn = ({ children, onClick, variant = "primary", className = "", size = "md", ...rest }) => {
  const sizes = { md: "px-5 py-2.5 text-sm", lg: "px-6 py-3 text-base", sm: "px-3.5 py-2 text-sm" };
  const base = "font-display inline-flex items-center justify-center gap-2 font-600 uppercase tracking-wide rounded transition-all duration-150 cursor-pointer";
  const styles = {
    primary: { background: "#1e40af", color: "#fff" },
    amber: { background: "#fbbf24", color: "#0f172a" },
    dark: { background: "#0f172a", color: "#fff" },
    ghost: { background: "transparent", color: "#1e40af", border: "1px solid #cbd5e1" },
    ghostLight: { background: "transparent", color: "#fff", border: "1px solid rgba(255,255,255,0.35)" },
  }[variant];
  return (
    <button onClick={onClick} className={`${base} ${sizes[size]} ${className} hover:opacity-90`}
      style={{ ...styles, letterSpacing: "0.04em" }} {...rest}>
      {children}
    </button>
  );
};

/* ----------------------------------------------------------------------- */
/* Search box (used in hero + header)                                       */
/* ----------------------------------------------------------------------- */

function SearchBox({ onPick, big }) {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  const results = useMemo(() => {
    if (q.trim().length < 1) return [];
    const n = norm(q);
    return MODELS.filter((m) => norm(`${m.make}${m.model}`).includes(n)).slice(0, 7);
  }, [q]);

  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);

  return (
    <div ref={ref} className="relative w-full">
      <div className="flex items-center gap-2 rounded bg-white"
        style={{ border: "1px solid #cbd5e1", padding: big ? "6px 6px 6px 16px" : "4px 4px 4px 12px", boxShadow: "0 1px 2px rgba(15,23,42,0.06)" }}>
        <Search size={big ? 22 : 18} color="#475569" className="shrink-0" />
        <input
          value={q}
          onChange={(e) => { setQ(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)}
          placeholder={big ? "Try “GS-1930”, “JLG 2632ES”, or “Skyjack”…" : "Search a competitor model…"}
          className="font-pn w-full bg-transparent outline-none"
          style={{ fontSize: big ? 17 : 14, color: "#0f172a", padding: "6px 0" }}
        />
        <Btn size={big ? "md" : "sm"} variant="amber" onClick={() => { if (results[0]) { onPick(results[0]); setOpen(false); } }}>
          {big ? "Find my match" : "Go"} <ArrowRight size={16} />
        </Btn>
      </div>

      {open && results.length > 0 && (
        <div className="absolute left-0 right-0 z-30 mt-2 overflow-hidden rounded bg-white"
          style={{ border: "1px solid #cbd5e1", boxShadow: "0 16px 40px rgba(15,23,42,0.18)" }}>
          {results.map((m) => (
            <button key={m.id} onMouseDown={() => { onPick(m); setOpen(false); }}
              className="flex w-full items-center justify-between px-4 py-2.5 text-left hover:bg-slate-50">
              <span className="flex items-center gap-3">
                <BrandDot make={m.make} />
                <span className="font-pn text-sm text-slate-900">{m.make} {m.model}</span>
              </span>
              <span className="text-xs text-slate-500">{m.workingHt} ft working · {m.capacity} lb</span>
            </button>
          ))}
        </div>
      )}
      {open && q.trim().length >= 1 && results.length === 0 && (
        <div className="absolute left-0 right-0 z-30 mt-2 rounded bg-white px-4 py-3 text-sm text-slate-600"
          style={{ border: "1px solid #cbd5e1", boxShadow: "0 16px 40px rgba(15,23,42,0.18)" }}>
          No match yet — <button onMouseDown={() => onPick("__quote__")} className="font-600 text-blue-700 underline">request a quote</button> and a specialist will source it.
        </div>
      )}
    </div>
  );
}

/* ----------------------------------------------------------------------- */
/* Header / Footer                                                          */
/* ----------------------------------------------------------------------- */

function AddressBar() {
  return (
    <div className="flex items-center gap-2 bg-slate-200 px-3 py-1.5 text-xs text-slate-600">
      <span className="flex gap-1.5">
        <span className="h-2.5 w-2.5 rounded-full bg-slate-400" />
        <span className="h-2.5 w-2.5 rounded-full bg-slate-400" />
        <span className="h-2.5 w-2.5 rounded-full bg-slate-400" />
      </span>

}

/* ----------------------------------------------------------------------- */
/* Trust strip                                                              */
/* ----------------------------------------------------------------------- */

  { icon: Clock, t: "60 years", s: "in material handling" },
  { icon: Building2, t: "Rite-Hite family", s: "national backing" },

/* ----------------------------------------------------------------------- */
/* SEO inspector — sells the programmatic structure to the stakeholder      */
/* ----------------------------------------------------------------------- */

function SeoPanel({ kind, model, height }) {
  let slug, title, h1, desc;
  if (kind === "model") {
    slug = `/scissor-lift/${model.slug}`;
    title = `${model.make} ${model.model} — Comparable Electric Scissor Lift | Johnson Equipment`;
    h1 = `${model.make} ${model.model} — Comparable Johnson Equipment Scissor Lift`;
    desc = `Comparing the ${model.make} ${model.model}? See the comparable ${model.workingHt} ft electric scissor lift from Johnson Equipment, matched on capacity and footprint. Get a fast quote.`;
  } else {
    slug = `/${height.slug}`;
    title = `${height.label} — Compare Models & Get a Quote | Johnson Equipment`;
    h1 = height.label;
    desc = `Compare every major ${height.key} ft electric scissor lift — Genie, JLG, Skyjack, MEC and more — and get a comparable Johnson Equipment unit quoted fast.`;
  }
  const idx = kind === "model" ? model.id : 50 + HEIGHTS.findIndex((h) => h.key === height.key);
  const Row = ({ k, v }) => (
    <div className="grid grid-cols-[110px_1fr] gap-3 py-1.5">
      <div className="font-display text-xs font-600 uppercase tracking-wider text-amber-300">{k}</div>
      <div className="font-pn text-xs text-slate-200 break-words">{v}</div>
    </div>
  );
  return (
    <div className="my-6 rounded-lg p-5" style={{ background: "#0f172a", border: "1px solid #1e293b" }}>
      <div className="mb-3 flex items-center gap-2">
        <Code2 size={16} color="#fbbf24" />
        <span className="font-display text-sm font-700 uppercase tracking-widest text-white">SEO layer</span>
        <span className="ml-auto font-pn text-xs text-slate-400">page {idx} of {MODELS.length + HEIGHTS.length} generated from your list</span>
      </div>
      <div className="divide-y divide-slate-800">
        <Row k="URL" v={`scissorlifts.jequip.com${slug}`} />
        <Row k="Title" v={title} />
        <Row k="H1" v={h1} />
        <Row k="Meta" v={desc} />
        <Row k="Schema" v={kind === "model" ? "Product + Offer (price on request) + Brand comparison" : "CollectionPage + ItemList"} />
      </div>
    </div>
  );
}

        </div>
        <HazardRule />

      <TrustStrip />

      {/* height categories */}

        <h2 className="font-display mt-3 text-3xl font-700 text-slate-900">Find your class, find your match</h2>
        <div className="mt-8 grid gap-4 md:grid-cols-2 lg:grid-cols-4">
          {HEIGHTS.map((h) => (
            <button key={h.key} onClick={() => nav({ page: "category", key: h.key })}
              className="group flex flex-col rounded-lg bg-white p-6 text-left transition-all hover:-translate-y-1"

              <div className="font-display mt-1 text-xs font-600 uppercase tracking-widest text-slate-400">{h.working} ft working height</div>

          <div className="mt-8 grid gap-6 md:grid-cols-3">

              { t: "Get quoted", s: "One short form goes straight to your lift specialist for pricing and lead time." },

                <p className="mt-2 text-sm text-slate-600">{x.s}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* CTA band */}
      <section className="mx-auto my-14 max-w-6xl px-5">
        <div className="overflow-hidden rounded-xl" style={{ background: "#1e40af" }}>
          <div className="flex flex-col items-start justify-between gap-5 p-8 md:flex-row md:items-center">

              <h3 className="font-display text-2xl font-700 text-white">Already know the model you need replaced?</h3>

          </div>
          <HazardRule h={5} />

      </section>

  );
}

/* ----------------------------------------------------------------------- */
/* Category page                                                            */
/* ----------------------------------------------------------------------- */

function Category({ height, nav, onPick, showSeo }) {

    <div className="mx-auto max-w-6xl px-5 py-10">

              <BrandDot make={m.make} />

            <div className="font-pn text-sm text-slate-700">{m.workingHt} ft</div>
            <div className="font-pn text-sm text-slate-700">{m.capacity} lb</div>
            <div className="font-pn text-sm text-slate-700">{m.width}″</div>
            <div className="col-span-2 mt-2 flex items-center gap-1 font-display text-xs font-600 uppercase tracking-wide text-blue-700 md:col-span-1 md:mt-0 md:justify-end">
              Compare <ArrowRight size={14} />
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ----------------------------------------------------------------------- */
/* Model comparison page — the money page                                   */
/* ----------------------------------------------------------------------- */

function SpecCompare({ m }) {
  const rows = [
    ["Working height", `${m.workingHt} ft`, `${m.workingHt} ft`, true],
    ["Platform height", `${m.platformHt} ft`, `${m.platformHt} ft`, true],
    ["Platform capacity", `${m.capacity} lb`, `${m.capacity} lb`, true],
    ["Machine width", `${m.width} in`, `${m.width} in`, true],
    ["Power", m.power, m.power, true],
    ["Drive height", m.driveHeight, m.driveHeight, true],
  ];
  return (
    <div className="overflow-hidden rounded-lg bg-white" style={{ border: "1px solid #e2e8f0" }}>
      <div className="grid grid-cols-[1.1fr_1fr_1fr]" style={{ background: "#f1f5f9" }}>
        <div className="px-5 py-3 font-display text-xs font-600 uppercase tracking-widest text-slate-500">Spec</div>
        <div className="px-5 py-3 font-display text-xs font-600 uppercase tracking-widest text-slate-700">{m.make} {m.model}</div>
        <div className="px-5 py-3 font-display text-xs font-700 uppercase tracking-widest" style={{ background: "#1e40af", color: "#fff" }}>Johnson comparable</div>
      </div>
      {rows.map(([k, a, b, match], i) => (
        <div key={i} className="grid grid-cols-[1.1fr_1fr_1fr] border-t" style={{ borderColor: "#f1f5f9" }}>
          <div className="px-5 py-3 text-sm font-500 text-slate-500">{k}</div>
          <div className="font-pn px-5 py-3 text-sm text-slate-800">{a}</div>
          <div className="font-pn flex items-center gap-2 px-5 py-3 text-sm text-slate-900" style={{ background: "#f8fafc" }}>
            {match && <Check size={15} color="#16a34a" className="shrink-0" />}{b}
          </div>
        </div>
      ))}
    </div>
  );
}

function ModelPage({ m, nav, onPick, onQuote, showSeo }) {
  const related = inHeight(m.heightKey).filter((x) => x.id !== m.id).slice(0, 4);
  const height = HEIGHTS.find((h) => h.key === m.heightKey);
  return (
    <div className="mx-auto max-w-6xl px-5 py-10">
      <button onClick={() => nav({ page: "category", key: m.heightKey })} className="mb-6 flex items-center gap-1 text-sm text-slate-500 hover:text-slate-800">
        <ChevronLeft size={16} /> {height.label}
      </button>

      <Eyebrow>Cross-reference · {height.working} ft electric</Eyebrow>
      <h1 className="font-display mt-3 text-3xl font-700 text-slate-900 md:text-4xl">
        {m.make} {m.model} — comparable Johnson Equipment scissor lift
      </h1>
      <p className="mt-3 max-w-3xl text-lg text-slate-600">
        Comparing the {m.make} {m.model}? Here’s the equivalent electric scissor lift from Johnson Equipment —
        matched on working height, platform capacity and footprint, and backed by service you can actually reach.
      </p>

      {showSeo && <SeoPanel kind="model" model={m} />}

      {/* interchange card — the signature element */}
      <div className="mt-8 grid items-stretch gap-4 md:grid-cols-[1fr_auto_1fr]">
        <div className="rounded-lg p-6" style={{ background: "#fff", border: "1px solid #e2e8f0" }}>
          <div className="font-display text-xs font-600 uppercase tracking-widest text-slate-400">You’re comparing</div>
          <div className="mt-2 flex items-center gap-2"><BrandDot make={m.make} />
            <span className="font-display text-lg font-700 text-slate-900">{m.make}</span></div>
          <div className="mt-2"><PN>{m.model}</PN></div>
          <div className="mt-3 text-sm text-slate-500">{m.workingHt} ft working · {m.capacity} lb · {m.width}″ wide</div>
        </div>
        <div className="flex items-center justify-center">
          <div className="flex h-12 w-12 items-center justify-center rounded-full" style={{ background: "#fbbf24" }}>
            <ArrowLeftRight size={22} color="#0f172a" />
          </div>
        </div>
        <div className="rounded-lg p-6 text-white" style={{ background: "#1e40af" }}>
          <div className="font-display text-xs font-600 uppercase tracking-widest" style={{ color: "#fbbf24" }}>Johnson comparable</div>
          <div className="mt-2 font-display text-lg font-700">Johnson Equipment · {m.workingHt} ft electric</div>
          <div className="mt-2 flex items-center gap-2">
            <PN tone="amber">{m.jePN}</PN>
            <span className="rounded px-2 py-0.5 text-xs font-600" style={{ background: "rgba(255,255,255,0.15)" }}>placeholder PN</span>
          </div>
          <div className="mt-3 text-sm text-blue-100">Meets or exceeds the {m.model} on every spec below.</div>
        </div>
      </div>

      {/* specs + quote */}
      <div className="mt-8 grid gap-8 lg:grid-cols-[1.4fr_1fr]">
        <div>
          <h2 className="font-display mb-3 text-xl font-700 text-slate-900">Spec-for-spec comparison</h2>
          <SpecCompare m={m} />
          <p className="mt-3 text-xs text-slate-400">
            Representative specs for this proof of concept. Final Johnson Equipment model and verified figures
            drop in once the cross-reference is confirmed.
          </p>

          <div className="mt-8 rounded-lg p-6" style={{ background: "#f8fafc", border: "1px solid #e2e8f0" }}>
            <h3 className="font-display text-lg font-700 text-slate-900">Why buy the comparable from Johnson</h3>
            <div className="mt-4 grid gap-3 sm:grid-cols-2">
              {[
                [Wrench, "Service that shows up", "Factory-trained techs across five states, not a drop-ship listing."],
                [Clock, "60 years of uptime", "Six decades keeping Fortune 500 docks and lifts running."],
                [ShieldCheck, "Rite-Hite backing", "National parts and safety engineering behind every quote."],
                [Phone, "A real specialist", "One named contact who quotes, schedules and supports the unit."],
              ].map(([Icon, t, s], i) => (
                <div key={i} className="flex gap-3">
                  <Icon size={18} color="#1e40af" className="mt-0.5 shrink-0" />
                  <div><div className="font-display text-sm font-700 text-slate-900">{t}</div>
                    <div className="text-sm text-slate-600">{s}</div></div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* sticky quote rail */}
        <div>
          <div className="sticky top-28 rounded-lg p-6" style={{ background: "#0f172a" }}>
            <div className="font-display text-xs font-600 uppercase tracking-widest" style={{ color: "#fbbf24" }}>Get pricing</div>
            <h3 className="font-display mt-1 text-xl font-700 text-white">Quote the comparable to your {m.model}</h3>
            <p className="mt-2 text-sm text-slate-300">Goes straight to your Johnson Equipment lift specialist. No call center.</p>
            <Btn variant="amber" size="lg" className="mt-5 w-full" onClick={() => onQuote(m)}>
              Request my quote <ArrowRight size={18} />
            </Btn>
            <div className="mt-4 flex items-center gap-2 font-pn text-sm text-slate-400">
              <Phone size={14} color="#fbbf24" /> or call (800) 555-0142
            </div>
          </div>
        </div>
      </div>

      {/* related */}
      <div className="mt-12">
        <h2 className="font-display mb-4 text-xl font-700 text-slate-900">Also in {height.key} ft</h2>
        <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
          {related.map((r) => (
            <button key={r.id} onClick={() => onPick(r)} className="rounded-lg bg-white p-4 text-left hover:-translate-y-0.5"
              style={{ border: "1px solid #e2e8f0" }}>
              <div className="flex items-center gap-2"><BrandDot make={r.make} />
                <span className="text-xs uppercase tracking-wide text-slate-400">{r.make}</span></div>
              <div className="font-pn mt-1 text-sm font-500 text-slate-900">{r.model}</div>
              <div className="mt-1 text-xs text-slate-500">{r.capacity} lb · {r.width}″</div>
            </button>
          ))}
        </div>
      </div>

      <p className="mt-10 text-xs text-slate-400">
        {m.make}® and {m.model} are trademarks of their respective owners. Johnson Equipment is not affiliated
        with or endorsed by {m.make}; the model is referenced for comparison only.
      </p>
    </div>
  );
}

/* ----------------------------------------------------------------------- */
/* Quote modal                                                              */
/* ----------------------------------------------------------------------- */

function QuoteModal({ open, onClose, model }) {
  const [sent, setSent] = useState(false);
  const [f, setF] = useState({ name: "", company: "", email: "", phone: "", zip: "", notes: "" });
  useEffect(() => { if (open) { setSent(false); setF({ name: "", company: "", email: "", phone: "", zip: "", notes: "" }); } }, [open, model]);
  if (!open) return null;

  const Field = ({ k, label, ph, half, area }) => (
    <label className={half ? "block" : "col-span-2 block"}>
      <span className="font-display mb-1 block text-xs font-600 uppercase tracking-wider text-slate-500">{label}</span>
      {area ? (
        <textarea rows={3} value={f[k]} onChange={(e) => setF((p) => ({ ...p, [k]: e.target.value }))} placeholder={ph}
          className="w-full rounded px-3 py-2 text-sm outline-none" style={{ border: "1px solid #cbd5e1" }} />
      ) : (
        <input value={f[k]} onChange={(e) => setF((p) => ({ ...p, [k]: e.target.value }))} placeholder={ph}
          className="w-full rounded px-3 py-2 text-sm outline-none" style={{ border: "1px solid #cbd5e1" }} />
      )}
    </label>
  );

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center p-0 md:items-center md:p-6"
      style={{ background: "rgba(15,23,42,0.6)" }} onMouseDown={onClose}>
      <div onMouseDown={(e) => e.stopPropagation()}
        className="w-full max-w-lg overflow-hidden rounded-t-2xl bg-white md:rounded-2xl"
        style={{ maxHeight: "92vh", overflowY: "auto" }}>
        <div className="flex items-center justify-between px-6 py-4" style={{ background: "#0f172a" }}>
          <div>
            <div className="font-display text-xs font-600 uppercase tracking-widest" style={{ color: "#fbbf24" }}>Request a quote</div>
            <div className="font-display text-lg font-700 text-white">
              {model ? `Comparable to ${model.make} ${model.model}` : "Electric scissor lift"}
            </div>
          </div>
          <button onClick={onClose}><X color="#94a3b8" /></button>
        </div>

        {sent ? (
          <div className="px-6 py-12 text-center">
            <div className="mx-auto flex h-14 w-14 items-center justify-center rounded-full" style={{ background: "#dcfce7" }}>
              <Check size={28} color="#16a34a" />
            </div>
            <h3 className="font-display mt-4 text-2xl font-700 text-slate-900">Quote request sent</h3>
            <p className="mx-auto mt-2 max-w-sm text-slate-600">
              This goes straight to your Johnson Equipment lift specialist — not a call center. Expect pricing
              and lead time {model ? `on a comparable to the ${model.model} ` : ""}within one business day.
            </p>
            <Btn className="mt-6" onClick={onClose}>Done</Btn>
          </div>
        ) : (
          <div className="px-6 py-5">
            {model && (
              <div className="mb-4 flex items-center gap-2 rounded-lg px-4 py-3" style={{ background: "#eff6ff" }}>
                <ArrowLeftRight size={16} color="#1e40af" />
                <span className="text-sm text-slate-700">Matching a comparable unit to your</span>
                <PN>{model.model}</PN>
              </div>
            )}
            <div className="grid grid-cols-2 gap-3">
              <Field k="name" label="Name" ph="Jordan Smith" half />
              <Field k="company" label="Company" ph="Acme Logistics" half />
              <Field k="email" label="Email" ph="jordan@acme.com" half />
              <Field k="phone" label="Phone" ph="(214) 555-0142" half />
              <Field k="zip" label="ZIP / job site" ph="75081" half />
              <Field k="notes" label="Anything else?" ph="Qty, timeline, rental vs purchase…" area />
            </div>
            <Btn variant="amber" size="lg" className="mt-4 w-full" onClick={() => setSent(true)}>
              Send to my specialist <ArrowRight size={18} />
            </Btn>
            <p className="mt-3 text-center text-xs text-slate-400">Prototype — no data is submitted or stored.</p>
          </div>
        )}
      </div>
    </div>
  );
}

/* ----------------------------------------------------------------------- */
/* App                                                                      */
/* ----------------------------------------------------------------------- */

function App() {
  const [route, setRoute] = useState({ page: "home" });
  const [quote, setQuote] = useState({ open: false, model: null });
  const [showSeo, setShowSeo] = useState(false);
  const scroller = useRef(null);

  useEffect(() => {
    const id = "je-fonts";
    if (!document.getElementById(id)) {
      const l = document.createElement("link");
      l.id = id; l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap";
      document.head.appendChild(l);
      const s = document.createElement("style");
      s.textContent = `
        .je-root,.je-root input,.je-root textarea,.je-root button{font-family:'Inter',system-ui,sans-serif;}
        .je-root .font-display{font-family:'Oswald','Inter',sans-serif;}
        .je-root .font-pn{font-family:'IBM Plex Mono',ui-monospace,monospace;}
        .je-root .font-500{font-weight:500;} .je-root .font-600{font-weight:600;} .je-root .font-700{font-weight:700;}
        @media (prefers-reduced-motion: reduce){.je-root *{transition:none!important;animation:none!important;}}
      `;
      document.head.appendChild(s);
    }
  }, []);

  const nav = (r) => { setRoute(r); if (scroller.current) scroller.current.scrollTop = 0; };
  const pick = (m) => { if (m === "__quote__") setQuote({ open: true, model: null }); else nav({ page: "model", slug: m.slug }); };
  const openQuote = (m) => setQuote({ open: true, model: m && m.slug ? m : null });

  const model = route.page === "model" ? findModel(route.slug) : null;
  const height = route.page === "category" ? HEIGHTS.find((h) => h.key === route.key) : null;

  return (
    <div className="je-root" style={{ background: "#fff", color: "#0f172a" }}>
      <AddressBar />
      <div ref={scroller} style={{ maxHeight: "calc(100vh - 33px)", overflowY: "auto" }}>
        <Header nav={nav} onQuote={() => openQuote(null)} />

        {route.page === "home" && <Home nav={nav} onPick={pick} onQuote={() => openQuote(null)} />}
        {route.page === "category" && height && <Category height={height} nav={nav} onPick={pick} showSeo={showSeo} />}
        {route.page === "model" && model && <ModelPage m={model} nav={nav} onPick={pick} onQuote={openQuote} showSeo={showSeo} />}

        <Footer nav={nav} />
      </div>

      {/* stakeholder SEO toggle */}
      <button onClick={() => setShowSeo((s) => !s)}
        className="fixed bottom-5 right-5 z-40 flex items-center gap-2 rounded-full px-4 py-2.5 font-display text-xs font-600 uppercase tracking-wide shadow-lg"
        style={{ background: showSeo ? "#fbbf24" : "#0f172a", color: showSeo ? "#0f172a" : "#fff", letterSpacing: "0.05em" }}>
        <Code2 size={15} /> {showSeo ? "Hide" : "Show"} SEO layer
      </button>

      <QuoteModal open={quote.open} model={quote.model} onClose={() => setQuote({ open: false, model: null })} />
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>

<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</body>
